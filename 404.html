<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фионика</title>
<script>
/* GitHub Pages отдаёт этот файл на любой неизвестный адрес.
   Задача: .../kodokvest/admin (без #) открывает панель репетитора,
   всё остальное — честная страница «такого адреса нет» со списком разделов. */
(function(){
  var p = location.pathname;
  var m = p.match(/^(.*\/)admin\/?$/i);
  if (m){ location.replace(m[1] + "?admin" + (location.hash || "")); return; }
  /* ⚠️ Молчаливого перенаправления больше НЕТ, и это решение, а не упущение.
     Раньше любой неизвестный адрес заменялся на корень раздела: человек,
     ошибшийся в адресе, оказывался неизвестно где и не знал, что ошибся.
     Плюс на адресе со слэшем на конце регулярка совпадала с пустым хвостом,
     адрес не менялся, и браузер заменял страницу сам на себя. Теперь страница
     говорит вслух, что такого адреса нет, и показывает все, какие есть.
     Единственное исключение — .../admin: это не ошибка, а дверь. */
})();
</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       margin:0;padding:48px 24px;color:#1a1f3d;background:#f6f7fc;line-height:1.5}
  .box{max-width:1080px;margin:0 auto}
  h1{font-size:30px;margin:0 0 10px}
  p{margin:0 0 14px;color:#4a5372}
  a{color:#5a41e0}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .row a{display:inline-block;padding:10px 16px;border-radius:12px;
         border:1px solid #c3cbe4;background:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>Такой страницы нет</h1>
  <p>Адрес набран с ошибкой или страницу переименовали. Вот всё, что есть:</p>
  <div class="row">
    <a href="./">Тренажёр</a>
    <a href="./vitrina/">Сайт Фионики</a>
    <a href="./repetitoru/">Репетитору</a>

    <a href="./shkole/">Школе</a>
    <a href="./baza/">Справочник</a>
    <a href="./kontakty/">Контакты</a>
  </div>
</div>
</body>
</html>
