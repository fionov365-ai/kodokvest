<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кодоквест — Python для подростков</title>
<meta name="description" content="Сто уроков Python в браузере: код запускается сразу, рисует и объясняет ошибки понятными словами.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<!-- Установка на домашний экран и работа без сети. Ссылки на манифест и иконку
     build.js из одного файла ВЫРЕЗАЕТ: тот файл обещает «ничего не грузится
     извне», а неразрешимая ссылка это обещание бы нарушила. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#f1f4fc" id="themecolor">
<meta name="apple-mobile-web-app-title" content="Кодоквест">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<!-- Тема ставится ДО первой отрисовки и до загрузки js/app.js. Если сделать
     это позже, тот, у кого выбрана тёмная, увидит вспышку светлого фона —
     страница успеет нарисоваться в теме по умолчанию. Скрипт крошечный и
     нарочно не зависит ни от чего: он обязан отработать даже если app.js
     не загрузился. -->
<script>
(function(){
  try{
    var t = localStorage.getItem("kodokvest_theme");
    if (t !== "dark" && t !== "light") t = "light";
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#0d1020" : "#f1f4fc");
  }catch(e){}
})();
</script>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="logo" id="logo"><span class="mark">🐍</span><b>Кодоквест</b></div>
    <!-- Три вкладки вместо одиннадцати кнопок. Раньше в панели лежали рядом
         и уроки, и игры, и шпаргалка, и профиль — одиннадцать равных кнопок,
         из которых ребёнку не видно, что главное и с чего начинать. Теперь
         слева «куда идти», справа «сколько сделано» и инструменты под рукой,
         а «что там внутри» объясняет сам экран. -->
    <nav class="tabs" aria-label="Разделы">
      <button class="tab" id="tab-home" data-tab="home">🏠 Главное</button>
      <button class="tab" id="tab-train" data-tab="train">🎯 Тренировки</button>
      <button class="tab" id="tab-mine" data-tab="mine">🎒 Моё</button>
    </nav>
    <div class="xpbox">
      <span class="lvlchip" id="rank">Новичок</span>
      <div class="xpbar"><i id="xpfill"></i></div>
      <span id="xptext">0 XP</span>
    </div>
    <span class="starcount" id="stars">★ 0</span>
    <button class="tbtn streak" id="btn-today" title="Задача дня и дни подряд">🔥 <span class="lbl">Сегодня</span></button>
    <button class="tbtn" id="btn-sheet" title="Справочник по командам (открывается поверх урока)">📖</button>
    <button class="tbtn who" id="btn-who" title="Профиль">👤</button>
    <button class="tbtn" id="btn-focus" title="Спрятать всё лишнее">⛶</button>
    <!-- Пятый инструмент, и он же единственный, которому разрешено быть
         пятым: «?» отвечает на вопрос «что это за экран и что тут делать»
         для ЛЮБОГО экрана. Раньше такой ответ был только на Главном и только
         у новичка — дальше ребёнок оставался один на один с «Визуализатором»
         и «Повторить», о которых по названию не догадаешься. -->
    <button class="tbtn help" id="btn-help" title="Подсказка: что это за экран и что тут делать" aria-haspopup="dialog" aria-expanded="false" aria-label="Подсказка про этот экран">?</button>
  </div>
</div>

<!-- Липкая полоска задания. Нужна на узком экране, где колонка одна: уйдя
     в редактор, ребёнок терял из виду и текст задания, и дорогу назад. На
     широком экране её нет — там задание и так стоит рядом с редактором. -->
<div class="taskpin" id="taskpin" hidden>
  <div class="tprow">
    <button class="tpmain" id="tp-open" aria-expanded="false" aria-controls="tp-full">
      <span class="tpem">🎯</span><span class="tptxt" id="tp-txt"></span><span class="tpchev">▾</span>
    </button>
    <button class="tpup" id="tp-up" title="Вернуться к объяснению урока">↑ Объяснение</button>
  </div>
  <div class="tpfull" id="tp-full" hidden></div>
</div>

<div class="wrap" id="app"></div>

<div class="win" id="win"><div class="wincard" id="wincard"></div></div>

<!-- Шпаргалка живёт ПОВЕРХ страницы, а не отдельным экраном: чаще всего она
     нужна посреди урока, а уход со страницы урока стёр бы написанный код. -->
<div class="sheet" id="sheet" hidden>
  <div class="sheetbox" role="dialog" aria-label="Шпаргалка">
    <div class="sheethead">
      <b>📖 Шпаргалка</b>
      <input type="search" id="sheetq" placeholder="найти команду или слово" autocomplete="off" spellcheck="false">
      <label class="sheetall"><input type="checkbox" id="sheetall"> показать всё</label>
      <button class="rbtn sec" id="sheetclose" title="Закрыть (Esc)">✕</button>
    </div>
    <div class="sheetbody" id="sheetbody"></div>
  </div>
</div>
<!-- Сертификат — тоже оверлей, но по другой причине, чем шпаргалка: его
     ПЕЧАТАЮТ, а печать берёт документ целиком. Лист лежит поверх страницы,
     а в @media print всё остальное скрыто, и на бумагу уходит только он. -->
<div class="cert" id="cert" hidden>
  <div class="certwrap" role="dialog" aria-label="Сертификат">
    <div class="certbox" id="certbox"></div>
    <div class="certbar">
      <button class="bigbtn" id="certprint">🖨 Распечатать или сохранить в PDF</button>
      <button class="bigbtn ghost" id="certclose">Закрыть</button>
    </div>
  </div>
</div>

<!-- Помощь всплывает ПОВЕРХ страницы по той же причине, что и шпаргалка:
     чаще всего она нужна посреди урока, а уход со страницы стёр бы код. -->
<div class="helpwrap" id="helpwrap">
  <div class="helpveil" id="helpveil"></div>
  <!-- tabindex="-1" на самом окне: при открытии фокус уводится СЮДА, а не на
       «✕», иначе экранный диктор первым делом читает «Закрыть» вместо того,
       что это вообще за окно. -->
  <div class="helpbox" role="dialog" aria-modal="true" aria-labelledby="helptitle" tabindex="-1">
    <div class="helphead"><b id="helptitle">Подсказка</b>
      <button class="rbtn sec" id="helpclose" title="Закрыть (Esc)">✕</button></div>
    <div class="helpbody" id="helpbody"></div>
  </div>
</div>

<button class="toTop" id="totop" title="Наверх" aria-label="Наверх">↑</button>

<canvas id="confetti"></canvas>

<script src="js/engine-mini.js"></script>
<script src="js/runtime.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/games.js"></script>
<script src="js/warmups.js"></script>
<script src="js/ailab.js"></script>
<script src="js/projects.js"></script>
<script src="js/cheatsheet.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
